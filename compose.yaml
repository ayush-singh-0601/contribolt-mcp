services:
  contribolt:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "5178", "--origin", "https://${CONTRIBOLT_DOMAIN:?Set CONTRIBOLT_DOMAIN}", "--trust-proxy"]
    environment:
      CONTRIBOLT_DATA_DIR: /data
      CONTRIBOLT_WEBHOOK_SECRET: ${CONTRIBOLT_WEBHOOK_SECRET:-}
      CONTRIBOLT_INSTALLATION_ID: ${CONTRIBOLT_INSTALLATION_ID:-}
    volumes:
      - contribolt-data:/data
    expose: ["5178"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  proxy:
    image: caddy:2-alpine
    environment:
      CONTRIBOLT_DOMAIN: ${CONTRIBOLT_DOMAIN:?Set CONTRIBOLT_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [contribolt]
    restart: unless-stopped
volumes:
  contribolt-data:
  caddy-data:
  caddy-config:
