<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Recorded controlled Python contribution example</title><desc id="desc">A designed rendering of real fixture evidence, not a live product screenshot. Baseline fails, two regression checks pass after the fix, and the PR remains a dry-run preview.</desc><rect width="720" height="350" rx="20" fill="#102B35"/><path d="M0 51h720" stroke="#173A43"/><g fill="#6E9393"><circle cx="25" cy="26" r="4"/><circle cx="41" cy="26" r="4"/><circle cx="57" cy="26" r="4"/></g><text x="88" y="31" font-family="DejaVu Sans Mono,monospace" font-size="13" fill="#ADC7C8">ContriBolt / controlled Python fixture</text><text x="30" y="88" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#5CE0AB">$ sh test.sh</text><text x="30" y="121" font-family="DejaVu Sans Mono,monospace" font-size="16" fill="#FFB8A7">FAIL  baseline</text><text x="30" y="150" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#ADC7C8">assert increment(1) == 2</text><text x="30" y="176" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#ADC7C8">AssertionError</text><text x="30" y="221" font-family="DejaVu Sans Mono,monospace" font-size="16" fill="#5CE0AB">PASS  after the focused fix</text><text x="30" y="250" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#F5FAF7">2 Python regression checks passed</text><rect x="22" y="280" width="676" height="48" rx="12" fill="#173A43"/><text x="38" y="310" font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#D5F57A">PR dry-run preview · 0 public writes · fixture API data</text></svg>
