<svg xmlns="http://www.w3.org/2000/svg" width="500" height="638" viewBox="0 0 500 638" role="img" aria-labelledby="title desc"><title id="title">From verified issue to approved pull request</title><desc id="desc">Six stages, with the owner of each step and an explicit human approval before public writes.</desc><rect width="500" height="638" rx="24" fill="#F5FAF7"/><text x="30" y="37" font-family="DejaVu Sans Mono,monospace" font-size="12" letter-spacing="2" fill="#237A57">THE CONTRIBUTION WORKFLOW</text><path d="M52 118v38" stroke="#B5CEBF" stroke-width="2"/><rect x="26" y="56" width="448" height="78" rx="14" fill="white" stroke="#D5E3DB"/><rect x="40" y="75" width="38" height="38" rx="12" fill="#102B35"/><text x="59" y="100" font-family="DejaVu Sans Mono,monospace" font-size="14" text-anchor="middle" fill="#5CE0AB">01</text><text x="93" y="89" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#102B35">Discover an eligible issue</text><text x="93" y="113" font-family="DejaVu Sans,Arial,sans-serif" font-size="12.5" fill="#526876">ContriBolt · remote reads + local records</text><path d="M52 212v38" stroke="#B5CEBF" stroke-width="2"/><rect x="26" y="150" width="448" height="78" rx="14" fill="white" stroke="#D5E3DB"/><rect x="40" y="169" width="38" height="38" rx="12" fill="#102B35"/><text x="59" y="194" font-family="DejaVu Sans Mono,monospace" font-size="14" text-anchor="middle" fill="#5CE0AB">02</text><text x="93" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#102B35">Inspect policy and code</text><text x="93" y="207" font-family="DejaVu Sans,Arial,sans-serif" font-size="12.5" fill="#526876">ContriBolt + host · local clone</text><path d="M52 306v38" stroke="#B5CEBF" stroke-width="2"/><rect x="26" y="244" width="448" height="78" rx="14" fill="white" stroke="#D5E3DB"/><rect x="40" y="263" width="38" height="38" rx="12" fill="#102B35"/><text x="59" y="288" font-family="DejaVu Sans Mono,monospace" font-size="14" text-anchor="middle" fill="#5CE0AB">03</text><text x="93" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#102B35">Implement a focused fix</text><text x="93" y="301" font-family="DejaVu Sans,Arial,sans-serif" font-size="12.5" fill="#526876">Host coding agent · workspace edits</text><path d="M52 400v38" stroke="#B5CEBF" stroke-width="2"/><rect x="26" y="338" width="448" height="78" rx="14" fill="white" stroke="#D5E3DB"/><rect x="40" y="357" width="38" height="38" rx="12" fill="#102B35"/><text x="59" y="382" font-family="DejaVu Sans Mono,monospace" font-size="14" text-anchor="middle" fill="#5CE0AB">04</text><text x="93" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#102B35">Validate with evidence</text><text x="93" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="12.5" fill="#526876">Host-approved commands · captured results</text><path d="M52 494v38" stroke="#B5CEBF" stroke-width="2"/><rect x="26" y="432" width="448" height="78" rx="14" fill="white" stroke="#D5E3DB"/><rect x="40" y="451" width="38" height="38" rx="12" fill="#102B35"/><text x="59" y="476" font-family="DejaVu Sans Mono,monospace" font-size="14" text-anchor="middle" fill="#5CE0AB">05</text><text x="93" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#102B35">Review the PR preview</text><text x="93" y="489" font-family="DejaVu Sans,Arial,sans-serif" font-size="12.5" fill="#526876">You + host · no public contribution write</text><rect x="26" y="526" width="448" height="78" rx="14" fill="white" stroke="#237A57"/><rect x="40" y="545" width="38" height="38" rx="12" fill="#102B35"/><text x="59" y="570" font-family="DejaVu Sans Mono,monospace" font-size="14" text-anchor="middle" fill="#5CE0AB">06</text><text x="93" y="559" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#102B35">Approve publication</text><text x="93" y="583" font-family="DejaVu Sans,Arial,sans-serif" font-size="12.5" fill="#526876">Your terminal approval · then fresh recheck</text><text x="30" y="626" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#526876">Default: dry run. The host supplies the execution sandbox.</text></svg>
