name: npm release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated archive to the public npm registry
        type: boolean
        default: false
      npm_username:
        description: Expected npm account username (required when publishing)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify npm account
        if: inputs.publish
        run: node scripts/check-npm-publisher.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISHER: ${{ inputs.npm_username }}
      - run: node scripts/npm-preflight.mjs
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm pack --ignore-scripts
      - run: python scripts/audit-package.py contribolt-mcp-0.1.1.tgz > npm-release-manifest.json
      - run: python scripts/smoke-package.py
      - run: python scripts/smoke-stdio.py --require-sdk --modern
      - run: npm publish ./contribolt-mcp-0.1.1.tgz --dry-run --ignore-scripts --access public --provenance=false
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidate
          path: |
            contribolt-mcp-0.1.1.tgz
            npm-release-manifest.json
      - name: Require complete CI on this source commit
        if: inputs.publish
        run: node scripts/check-release-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the validated archive
        if: inputs.publish
        run: npm publish ./contribolt-mcp-0.1.1.tgz --ignore-scripts --access public --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify download from the public registry
        if: inputs.publish
        run: python scripts/smoke-registry.py
      - name: Select Node 22 for public installation verification
        if: inputs.publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Verify public download on Node 22
        if: inputs.publish
        run: python scripts/smoke-registry.py
      - name: Verify public README, metadata and versioned images
        if: inputs.publish
        run: node scripts/check-public-presentation.mjs
      - name: Mark the previous npm package as renamed
        if: inputs.publish
        run: npm deprecate 'mergepilot-mcp@*' 'Renamed to contribolt-mcp. Install contribolt-mcp instead.' --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
